# A version tag (v0.2.0, as package.json says) builds swcode for every platform, and the Windows desktop app, and
# publishes them as a GitHub release with their checksums: install.sh and install.ps1 download from the latest one.
# RELEASE_NOTES.md is the release's notes, which swcode's update offer shows.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: The tag is package.json's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: The release notes are the tag's version's
        run: test "$(head -n 1 RELEASE_NOTES.md)" = "# swcode ${GITHUB_REF_NAME#v}"
      - run: npm ci
      - run: npm run check
      - name: Build the command line for each platform, and the desktop app
        run: |
          npm run build:binary -- linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64
          node scripts/build-desktop.mjs
      - name: Checksums
        working-directory: dist
        run: sha256sum swcode-* > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "swcode $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md dist/swcode-* dist/SHA256SUMS
