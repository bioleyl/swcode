# swcode's Android app: the web app in a WebView of its own, built from the tag's pages, signed with the app's
# keystore, and put in that tag's release as swcode-android.apk with its checksum. It comes from there, not from a
# store, and takes its next release from there itself. A workflow of its own: an app that does not build leaves the
# release, already published, as it is.
name: Android app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - name: Build the pages the app brings
        run: npm run build
      - name: The app's own dependencies
        run: npm ci
        working-directory: mobile
      - name: The keystore the release is signed with
        working-directory: mobile/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set: an app without its keystore cannot be installed, or updated." >&2
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > swcode.keystore
          printf 'storeFile=swcode.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: The pages, as the app's assets
        run: npm run sync
        working-directory: mobile
      - name: Build the APK at the release's version
        working-directory: mobile/android
        run: |
          VERSION="$(node -p "require('../../package.json').version")"
          CODE="$(node -p "const [a, b, c] = require('../../package.json').version.split('.').map(Number); a * 10000 + b * 100 + c")"
          ./gradlew assembleRelease -PswcodeVersion="$VERSION" -PswcodeVersionCode="$CODE"
      - name: Name it, and its checksum
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk swcode-android.apk
          sha256sum swcode-android.apk > swcode-android.apk.sha256
      - name: Keep the APK of a run, which needs no release
        uses: actions/upload-artifact@v7
        with:
          name: swcode-android
          path: |
            swcode-android.apk
            swcode-android.apk.sha256
          if-no-files-found: error
      - name: Put it in the release the tag publishes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 20); do
            gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && break
            sleep 15
          done
          gh release upload "$GITHUB_REF_NAME" swcode-android.apk swcode-android.apk.sha256 --clobber
